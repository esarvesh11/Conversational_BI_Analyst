  # Pattern 6: Year-over-year comparison
  - name: year_over_year
    question: "How did employment change in Florida between 2023 and 2024?"
    sql: |
      SELECT
        YEAR(t.DATE) AS year,
        AVG(t.VALUE) AS avg_employment
      FROM SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.FINANCIAL_ECONOMIC_INDICATORS_TIMESERIES t
      JOIN SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.FINANCIAL_ECONOMIC_INDICATORS_ATTRIBUTES a
        ON t.VARIABLE = a.VARIABLE
      JOIN SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.GEOGRAPHY_INDEX g
        ON t.GEO_ID = g.GEO_ID
      WHERE a.MEASURE = 'Employment'
        AND a.FREQUENCY = 'Monthly'
        AND a.SEASONALLY_ADJUSTED = 'Not seasonally adjusted'
        AND a.RELEASE_SOURCE = 'Bureau of Labor Statistics'
        AND g.GEO_NAME = 'Florida'
        AND YEAR(t.DATE) IN (2023, 2024)
      GROUP BY YEAR(t.DATE)
      ORDER BY year
